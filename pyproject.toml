[project]
name = "rag-production"
version = "0.1.0"
description = "Production-ready RAG Chatbot: Agentic RAG + LlamaIndex + FastAPI + LangGraph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # --- API ---
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.34.0",
    "uvloop>=0.22.1",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    # --- Config & Validation ---
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "pydantic[email]>=2.11.0",
    "python-dotenv>=1.1.0",
    # --- LangGraph / LangChain ---
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.4.0",
    "langchain-qdrant>=0.2.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "asgiref>=3.8.0",
    # --- LlamaIndex ---
    "llama-index>=0.12.0",
    "llama-index-vector-stores-qdrant>=0.4.0",
    "llama-index-embeddings-huggingface>=0.4.0",
    "llama-index-embeddings-openai>=0.3.0",
    "llama-index-llms-openai>=0.3.0",
    "llama-index-llms-anthropic>=0.3.0",
    "llama-index-llms-ollama>=0.4.0",
    "llama-index-embeddings-ollama>=0.4.0",
    "llama-index-postprocessor-cohere-rerank>=0.3.0",
    "llama-index-readers-docling>=0.3.0",
    "llama-index-node-parser-docling>=0.3.0",
    # --- Database ---
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.3.0",
    "psycopg2-binary>=2.9.0",
    "psycopg-pool>=3.2.0",
    "asyncpg>=0.30.0",
    # --- Vector Store ---
    "qdrant-client>=1.13.0",
    # --- Long-term Memory ---
    "mem0ai>=1.0.0",
    # --- Auth ---
    "python-jose[cryptography]>=3.4.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.3.0",
    # --- Observability ---
    "langfuse>=3.9.0",
    "prometheus-client>=0.19.0",
    "starlette-prometheus>=0.7.0",
    "structlog>=25.2.0",
    # --- Document Processing ---
    "docling>=2.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "unstructured>=0.16.0",
    # --- Embeddings ---
    "sentence-transformers>=3.0.0",
    "openai>=1.0.0",
    # --- Utils ---
    "tenacity>=9.1.0",
    "slowapi>=0.1.9",
    "rich>=13.0.0",
    "colorama>=0.4.6",
    "tqdm>=4.67.0",
    "duckduckgo-search>=3.9.0",
    "email-validator>=2.2.0",
    # --- UI ---
    "streamlit>=1.40.0",
    "streamlit-chat>=0.1.1",
    # --- MCP ---
    "mcp>=1.0.0",
    "langchain-text-splitters>=1.1.1",
    "langchain-huggingface>=1.2.1",
    "langchain-ollama>=1.0.1",
    "fastembed>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "testcontainers>=4.0.0",
    "pytest-mock>=3.14.0",
]

[dependency-groups]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires running Docker services",
    "slow: marks tests as slow",
]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 119
exclude = ["migrations", "*.ipynb", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "B", "ERA", "D"]
ignore = ["E501", "F401", "D203", "D213", "B904", "B008", "D100", "D101", "D102", "D103", "D104"]
unfixable = ["B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.black]
line-length = 119
exclude = "venv|migrations"

[tool.isort]
profile = "black"
multi_line_output = "VERTICAL_HANGING_INDENT"
force_grid_wrap = 2
line_length = 119
